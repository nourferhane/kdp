services:
  - type: web
    name: kdp-factory
    runtime: docker
    dockerfilePath: ./src/Zunavio.KdpFactory.Web/Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /health/ready
    envVars:
      - key: MIGRATE_ON_STARTUP
        value: "true"
      - key: SEED_DEMO_PROJECT
        value: "true"
      - key: RUN_BACKGROUND_WORKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: kdp-factory-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_ROOT_FOLDER_ID
        sync: false
      - key: GOOGLE_PROMPTS_FOLDER_ID
        sync: false
      - key: GOOGLE_CONTROL_CENTER_SPREADSHEET_ID
        sync: false

databases:
  - name: kdp-factory-db
    databaseName: kdpfactory
    user: kdp
    plan: basic