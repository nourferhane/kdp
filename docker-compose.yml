services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kdp}
      POSTGRES_DB: ${POSTGRES_DB:-kdpfactory}
    volumes:
      - kdp_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kdp} -d ${POSTGRES_DB:-kdpfactory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: src/Zunavio.KdpFactory.Web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://kdp:kdp@db:5432/kdpfactory}
      MIGRATE_ON_STARTUP: "true"
      SEED_DEMO_PROJECT: "true"
      RUN_BACKGROUND_WORKER: "true"
      # Required: dashboard/API authentication. Values come from the host shell
      # or a local .env file (see .env.example). NEVER hardcode a real password.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ASSET_UPLOAD_API_KEY: ${ASSET_UPLOAD_API_KEY:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
      GOOGLE_ROOT_FOLDER_ID: ${GOOGLE_ROOT_FOLDER_ID:-}
      GOOGLE_PROMPTS_FOLDER_ID: ${GOOGLE_PROMPTS_FOLDER_ID:-}
      GOOGLE_PROJECT_FOLDER_ID: ${GOOGLE_PROJECT_FOLDER_ID:-}
      GOOGLE_CONTROL_CENTER_SPREADSHEET_ID: ${GOOGLE_CONTROL_CENTER_SPREADSHEET_ID:-}
      # Optional: OAuth Auth0 for /mcp. Leave unset in Development (placeholder scheme,
      # /mcp returns 401); both must be set in Production or the app refuses to start.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      # AI agents are optional; set these to enable the LLM layer:
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      # GOOGLE_ROOT_FOLDER_ID: ${GOOGLE_ROOT_FOLDER_ID}
      # GOOGLE_PROMPTS_FOLDER_ID: ${GOOGLE_PROMPTS_FOLDER_ID}
      # GOOGLE_CONTROL_CENTER_SPREADSHEET_ID: ${GOOGLE_CONTROL_CENTER_SPREADSHEET_ID}
    ports:
      - "8080:8080"

volumes:
  kdp_pgdata:
