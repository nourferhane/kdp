name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Zunavio.KdpFactory.sln

      - name: Build
        run: dotnet build Zunavio.KdpFactory.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Zunavio.KdpFactory.sln --configuration Release --no-build

      - name: Secret scan (light)
        run: |
          if git grep -nE "sk-[A-Za-z0-9]{16,}|AIza[0-9A-Za-z_-]{30,}|@Thewitcher" -- ':!*.md' ':!*.cs' ':!appsettings*.json'; then
            echo "Possible leaked secret pattern found"; exit 1
          fi
        shell: bash